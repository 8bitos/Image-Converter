<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#glow)" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Pixel / 8-Bit Grid Subtle Decoration -->
  <g opacity="0.15" fill="#38bdf8">
    <rect x="72" y="72" width="24" height="24" rx="4"/>
    <rect x="104" y="72" width="24" height="24" rx="4"/>
    <rect x="72" y="104" width="24" height="24" rx="4"/>
    <rect x="416" y="416" width="24" height="24" rx="4"/>
    <rect x="384" y="416" width="24" height="24" rx="4"/>
    <rect x="416" y="384" width="24" height="24" rx="4"/>
  </g>

  <!-- Center Graphic: Image Canvas Frame with Pixel Transformation Shift Arrows -->
  <rect x="106" y="106" width="300" height="300" rx="48" fill="#0f172a" stroke="url(#glow)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Image Landscape Peak / Triangle -->
  <path d="M150 330 L220 230 L280 300 L320 250 L362 330 Z" fill="url(#glow)" opacity="0.9"/>
  <circle cx="210" cy="190" r="24" fill="url(#accent)"/>

  <!-- Shift / Sync Arrows representing format transformation -->
  <g fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 150 A 40 40 0 0 1 370 190"/>
    <path d="M358 190 L370 190 L370 178"/>
    <path d="M182 362 A 40 40 0 0 1 142 322"/>
    <path d="M154 322 L142 322 L142 334"/>
  </g>
</svg>
